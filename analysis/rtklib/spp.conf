# RTKLIB (rnx2rtkp) configuration for the comparison with the pipeline:
# single point positioning with broadcast ephemerides, dual-frequency
# ionosphere-free combination, Saastamoinen troposphere and a 10 deg mask.
# The antenna offset is not applied, so the solution refers to the antenna
# reference point, as the pipeline's.
pos1-posmode       =single
pos1-frequency     =l1+l2
pos1-soltype       =forward
pos1-elmask        =10
pos1-ionoopt       =dual-freq
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-posopt5       =off
pos1-exclsats      =
out-solformat      =xyz
out-outhead        =off
out-timesys        =gpst
out-timeform       =tow
ant1-postype       =llh
ant1-antdele       =0
ant1-antdeln       =0
ant1-antdelu       =0
